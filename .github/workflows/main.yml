name: Create YouTube Plus app

on:
  # Push to this fork's main branch → auto-build with stored IPA secret.
  push:
    branches: [main]

  # Fired by SweptWasTaken/YTUHD after a successful YTUHD build,
  # so a fresh IPA is produced whenever YTUHD changes.
  repository_dispatch:
    types: [trigger-build]

  # Manual trigger — ipa_url is optional; leave blank to use the stored secret.
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file (leave blank to use stored secret)"
        default: ""
        required: false
        type: string

      tweak_version:
        description: "The version of the tweak to use. Enter the version manually from dayanch96/YTLite/releases or leave default"
        default: "5.2.1"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/dayanch96/YTLite#tweak-integration-details"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      # On push/repository_dispatch all inputs.* are null → default to false/5.2.1.
      enable_youpip: ${{ inputs.enable_youpip == true }}
      enable_yq:     ${{ inputs.enable_yq     == true }}
      enable_ryd:    ${{ inputs.enable_ryd     == true }}
      enable_ytabc:  ${{ inputs.enable_ytabc   == true }}
      enable_demc:   ${{ inputs.enable_demc    == true }}
      tweak_version: ${{ inputs.tweak_version || '5.2.1' }}

  package:
    name: Package IPA
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      # Resolve effective values for every input.
      # On push/repository_dispatch all inputs.* are empty → fall back to
      # hardcoded defaults (matching the workflow_dispatch defaults above).
      # EFF_* env vars are used throughout the rest of this job.
      - name: Resolve effective inputs
        run: |
          IPA="${{ inputs.ipa_url }}"
          echo "EFF_IPA_URL=${IPA:-${{ secrets.thatonefile }}}" >> $GITHUB_ENV

          VER="${{ inputs.tweak_version }}"
          echo "EFF_VERSION=${VER:-5.2.1}" >> $GITHUB_ENV

          NAME="${{ inputs.display_name }}"
          echo "EFF_DISPLAY_NAME=${NAME:-YouTube}" >> $GITHUB_ENV

          BID="${{ inputs.bundle_id }}"
          echo "EFF_BUNDLE_ID=${BID:-com.google.ios.youtube}" >> $GITHUB_ENV

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,info_note,tweak_version

      - name: Download and validate IPA
        run: |
          wget "${{ env.EFF_IPA_URL }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Install cyan and ldid
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          brew install ldid

      - name: Inject tweaks into IPA
        run: |
          # ytplus.deb is picked up by the glob below — do not list it explicitly
          # or it will be injected twice (duplicate LC_LOAD_DYLIB → double init crash)
          tweaks="OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o YouTubePlus_${{ env.EFF_VERSION }}.ipa -uwef $tweaks -n "${{ env.EFF_DISPLAY_NAME }}" -b ${{ env.EFF_BUNDLE_ID }}

      # FLEX.framework is embedded without a load command so FLEXHelperForYT
      # can dlopen() it lazily on user action. A normal cyan injection would
      # add a load command that runs FLEX's +load at dyld startup, crashing
      # YouTube's ObjC initialisation.
      - name: Embed FLEX Framework (no load command)
        run: |
          IPA="YouTubePlus_${{ env.EFF_VERSION }}.ipa"
          mkdir ipa_work
          unzip -q "$IPA" -d ipa_work
          cp -r FLEX.framework "ipa_work/Payload/YouTube.app/Frameworks/"
          ldid -S "ipa_work/Payload/YouTube.app/Frameworks/FLEX.framework/FLEX"
          cd ipa_work && zip -qry "../$IPA" Payload && cd ..
          rm -rf ipa_work

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytp-${{ github.run_number }}
          name: YouTubePlus v${{ env.EFF_VERSION }} (${{ github.run_number }})
          files: YouTubePlus_${{ env.EFF_VERSION }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"

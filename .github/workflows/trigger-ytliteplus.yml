name: Trigger YTLitePlusEXTRA rebuild
# Fires whenever a commit is pushed to the main branch of this YTLite fork,
# then dispatches a repository_dispatch event to SweptWasTaken/YTLitePlusEXTRA
# so a fresh IPA is built automatically with the updated YTLite source.
#
# Requires a secret named DISPATCH_TOKEN in this repo — a GitHub fine-grained
# PAT (or classic PAT with repo scope) that has "Actions: write" permission
# on SweptWasTaken/YTLitePlusEXTRA.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trigger-ytliteplus
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch to YTLitePlusEXTRA
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/SweptWasTaken/YTLitePlusEXTRA/dispatches \
            -d '{"event_type":"trigger-build"}' \
            --fail-with-body
